<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Braconier System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<header>
    <h1>🛰️ Anti-Braconier Monitoring</h1>
    <p id="status">🔴 Offline</p>
</header>


<div class="dashboard">

    <div class="card">
        <h2>🔋 Battery</h2>
        <p id="battery">-- %</p>
    </div>

    <div class="card">
        <h2>📶 Signal</h2>
        <p id="signal">-- dBm</p>
    </div>

    <div class="card">
        <h2>📡 Frequency</h2>
        <p id="frequency">-- MHz</p>
    </div>

    <div class="card">
        <h2>📍 Location</h2>
        <p id="location">--</p>
    </div>


    <div class="card">
        <h2>🌍 Latitude</h2>
        <p id="latitude">--</p>
    </div>


    <div class="card">
        <h2>🌍 Longitude</h2>
        <p id="longitude">--</p>
    </div>


    <div class="card">
        <h2>🕒 Last Update</h2>
        <p id="time">--</p>
    </div>

</div>


<h2 class="map-title">🗺️ Live Map</h2>

<div id="map"></div>


<h2 class="history-title">📊 History</h2>

<table>
    <thead>
        <tr>
            <th>Time</th>
            <th>Battery</th>
            <th>Signal</th>
            <th>Latitude</th>
            <th>Longitude</th>
        </tr>
    </thead>

    <tbody id="history">
    </tbody>

</table>
<div class="search-box">
    <input id="search" type="text" placeholder="ჩაწერე ადგილი...">
    <button onclick="searchLocation()">🔎 ძებნა</button>
</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
